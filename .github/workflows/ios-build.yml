name: Build and Deploy to TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --force

      - name: Build Web App
        env:
          VITE_SUPABASE_URL: https://rdqcwzosmikusketghyq.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkcWN3em9zbWlrdXNrZXRnaHlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDY2OTQsImV4cCI6MjEwMjcyMjY5NH0.bWBNSXqz3aLCsst0JxBTLt1tbFfCygv0WzUeGasvtdg
          VITE_AGORA_APP_ID: 42f01590d5f14201a201b5d85e2f944a
          VITE_AGORA_APP_CERTIFICATE: 22014c05e2db4ee8880e03bf67cdb617
        run: npx vite build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS App (.app)
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace \
                       -scheme App \
                       -sdk iphonesimulator \
                       -destination 'generic/platform=iOS Simulator' \
                       -configuration Debug \
                       -derivedDataPath build \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGN_IDENTITY="" \
                       COMPILER_INDEX_STORE_ENABLE=NO \
                       build
          else
            xcodebuild -project App.xcodeproj \
                       -scheme App \
                       -sdk iphonesimulator \
                       -destination 'generic/platform=iOS Simulator' \
                       -configuration Debug \
                       -derivedDataPath build \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGN_IDENTITY="" \
                       COMPILER_INDEX_STORE_ENABLE=NO \
                       build
          fi

      - name: Upload Build Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: pyngoo-ios-app
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app

      - name: Upload Build to TestFlight
        if: secrets.APP_STORE_PRIVATE_KEY != ''
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          issuer-id: ${{ secrets.APP_STORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_PRIVATE_KEY }}
