name: Build and Deploy to TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --force

      - name: Patch AdMob Plugin for Swift Compatibility
        run: node scratch/patch_admob.cjs

      - name: Build Web App
        env:
          VITE_SUPABASE_URL: https://rdqcwzosmikusketghyq.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkcWN3em9zbWlrdXNrZXRnaHlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDY2OTQsImV4cCI6MjEwMjcyMjY5NH0.bWBNSXqz3aLCsst0JxBTLt1tbFfCygv0WzUeGasvtdg
          VITE_AGORA_APP_ID: 42f01590d5f14201a201b5d85e2f944a
          VITE_AGORA_APP_CERTIFICATE: 22014c05e2db4ee8880e03bf67cdb617
        run: npx vite build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Re-apply AdMob Swift Patch After Sync
        run: node scratch/patch_admob.cjs

      - name: Select Official Xcode Release
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)
          
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision

          echo "$BUILD_CERTIFICATE_BASE64" | base64 -d > $CERTIFICATE_PATH
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 -d > $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -s $KEYCHAIN_PATH $(security list-keychains | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          
          # Extract UUID & Name from the provisioning profile plist cleanly without tabs
          PROV_UUID=$(security cms -D -i $PP_PATH | grep -A1 "<key>UUID</key>" | grep string | head -n1 | sed 's/<[^>]*>//g' | tr -d '\r\n\t ')
          PROV_NAME=$(security cms -D -i $PP_PATH | grep -A1 "<key>Name</key>" | grep string | head -n1 | sed 's/<[^>]*>//g' | tr -d '\r\n\t' | sed 's/^ *//;s/ *$//')

          echo "Found Provisioning Profile: Name='$PROV_NAME', UUID='$PROV_UUID'"
          
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/${PROV_UUID}.mobileprovision
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision

          echo "PROV_UUID=$PROV_UUID" >> $GITHUB_ENV
          echo "PROV_NAME=$PROV_NAME" >> $GITHUB_ENV

      - name: Build and Archive iOS App (.ipa)
        run: |
          cd ios/App
          
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>FX59PMTS6R</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>app.pyngoo.chat</key>
                  <string>${{ env.PROV_NAME }}</string>
              </dict>
          </dict>
          </plist>
          EOF

          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace \
                       -scheme App \
                       -destination 'generic/platform=iOS' \
                       -configuration Release \
                       -archivePath App.xcarchive \
                       DEVELOPMENT_TEAM="FX59PMTS6R" \
                       CODE_SIGN_STYLE="Manual" \
                       CODE_SIGN_IDENTITY="Apple Distribution" \
                       PROVISIONING_PROFILE_SPECIFIER="${{ env.PROV_NAME }}" \
                       archive
          else
            xcodebuild -project App.xcodeproj \
                       -scheme App \
                       -destination 'generic/platform=iOS' \
                       -configuration Release \
                       -archivePath App.xcarchive \
                       DEVELOPMENT_TEAM="FX59PMTS6R" \
                       CODE_SIGN_STYLE="Manual" \
                       CODE_SIGN_IDENTITY="Apple Distribution" \
                       PROVISIONING_PROFILE_SPECIFIER="${{ env.PROV_NAME }}" \
                       archive
          fi

          xcodebuild -exportArchive \
                     -archivePath App.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath output

      - name: Upload Signed IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: pyngoo-signed-ipa
          path: ios/App/output/*.ipa

      - name: Upload Signed IPA to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ios/App/output/App.ipa
          issuer-id: ${{ secrets.APP_STORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_PRIVATE_KEY }}
