<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyngoo Giriş Yapılıyor...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      margin-top: 24px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      padding: 12px 28px;
      border-radius: 24px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2 style="margin: 0 0 8px 0; font-size: 20px;">Giriş Yapılıyor...</h2>
  <p style="margin: 0; color: #94a3b8; font-size: 14px;">Pyngoo uygulamasına aktarılıyorsunuz.</p>
  <a id="returnBtn" class="btn" style="display: none;">Uygulamaya Dön</a>

  <script>
    (function() {
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      var targetUrl = 'pyngoo://auth-callback' + hash + (search ? (hash ? '&' : '?') + search.replace(/^\?/, '') : '');

      var btn = document.getElementById('returnBtn');
      if (btn) {
        btn.href = targetUrl;
      }

      // Otomatik yönlendir
      try {
        window.location.replace(targetUrl);
      } catch (e) {
        window.location.href = targetUrl;
      }

      // 1.5 sn sonra buton görünsün
      setTimeout(function() {
        if (btn) btn.style.display = 'inline-block';
      }, 1500);
    })();
  </script>
</body>
</html>
